<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8F7F4; }
      .card { fill: #FFFFFF; stroke: #DFDDD4; stroke-width: 2; }
      .card-accent-dark { fill: #18181B; }
      .card-accent-teal { fill: #0F766E; }
      .card-accent-amber { fill: #D97706; }
      .card-accent-violet { fill: #6D28D9; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 23px; font-weight: 800; fill: #18181B; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #52525B; }
      .arrow { stroke: #18181B; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Fondo cálido limpio -->
  <rect width="1200" height="460" rx="24" class="bg"/>

  <!-- Flechas de conexión -->
  <!-- 1 -> 2 -->
  <line x1="250" y1="230" x2="302" y2="230" class="arrow" marker-end="url(#arrowhead)"/>
  
  <!-- 2 -> 3A (arriba) y 3B (abajo) -->
  <path d="M 540 230 H 575 Q 595 230 595 210 V 145 Q 595 125 615 125 H 638" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 540 230 H 575 Q 595 230 595 250 V 315 Q 595 335 615 335 H 638" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- 3A y 3B -> 4 -->
  <path d="M 885 125 H 910 Q 930 125 930 145 V 210 Q 930 230 950 230 H 968" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 885 335 H 910 Q 930 335 930 315 V 250 Q 930 230 950 230 H 968" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- NODO 1: Usuario -->
  <g filter="url(#soft-shadow)">
    <rect x="40" y="150" width="210" height="160" rx="20" class="card"/>
    <path d="M 40 168 Q 40 150 58 150 H 232 Q 250 150 250 168 V 172 H 40 Z" class="card-accent-dark"/>
    <text x="145" y="222" text-anchor="middle" class="title">Usuario</text>
    <text x="145" y="255" text-anchor="middle" class="desc">Ingresa @usuario</text>
  </g>

  <!-- NODO 2: GitHub API -->
  <g filter="url(#soft-shadow)">
    <rect x="310" y="150" width="230" height="160" rx="20" class="card"/>
    <path d="M 310 168 Q 310 150 328 150 H 522 Q 540 150 540 168 V 172 H 310 Z" class="card-accent-teal"/>
    <text x="425" y="222" text-anchor="middle" class="title">GitHub API</text>
    <text x="425" y="255" text-anchor="middle" class="desc">Foto real y repositorios</text>
  </g>

  <!-- NODO 3A: Nano Banana 2.1 -->
  <g filter="url(#soft-shadow)">
    <rect x="645" y="55" width="240" height="145" rx="20" class="card"/>
    <path d="M 645 73 Q 645 55 663 55 H 867 Q 885 55 885 73 V 77 H 645 Z" class="card-accent-amber"/>
    <text x="765" y="122" text-anchor="middle" class="title">Nano Banana 2.1</text>
    <text x="765" y="155" text-anchor="middle" class="desc">Ilustración estilo cómic</text>
  </g>

  <!-- NODO 3B: Gemini Flash -->
  <g filter="url(#soft-shadow)">
    <rect x="645" y="260" width="240" height="145" rx="20" class="card"/>
    <path d="M 645 278 Q 645 260 663 260 H 867 Q 885 260 885 278 V 282 H 645 Z" class="card-accent-violet"/>
    <text x="765" y="327" text-anchor="middle" class="title">Gemini 3.8 Flash</text>
    <text x="765" y="360" text-anchor="middle" class="desc">Superpoderes y frase</text>
  </g>

  <!-- NODO 4: Carta Cómic -->
  <g filter="url(#soft-shadow)">
    <rect x="975" y="150" width="185" height="160" rx="20" class="card"/>
    <path d="M 975 168 Q 975 150 993 150 H 1142 Q 1160 150 1160 168 V 172 H 975 Z" class="card-accent-dark"/>
    <text x="1067" y="222" text-anchor="middle" class="title">Carta Cómic</text>
    <text x="1067" y="255" text-anchor="middle" class="desc">Web y Galería</text>
  </g>
</svg>
