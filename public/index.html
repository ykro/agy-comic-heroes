<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Comic Heroes — Google Antigravity 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F7F4EB;
      --ink: #0E1117;
      --yellow: #FFD60A;
      --red: #FF3B30;
      --blue: #0066FF;
      --card-bg: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(14, 17, 23, 0.12) 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, sans-serif;
      padding: 2rem 1.25rem 4rem;
    }
    .container {
      max-width: 1160px;
      margin: 0 auto;
    }
    .masthead {
      background: var(--yellow);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      padding: 1.25rem 1.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .masthead-title {
      font-family: "Bangers", cursive;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      line-height: 1;
      margin: 0;
      color: var(--ink);
      text-shadow: 2px 2px 0 #FFFFFF;
    }
    .masthead-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.35rem;
    }
    .search-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-bar input {
      font-family: "JetBrains Mono", monospace;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.75rem 1rem;
      border: 3px solid var(--ink);
      background: #FFFFFF;
      color: var(--ink);
      min-width: 220px;
      box-shadow: 4px 4px 0 var(--ink);
    }
    .btn {
      font-family: "Bangers", cursive;
      font-size: 1.35rem;
      letter-spacing: 0.05em;
      padding: 0.6rem 1.35rem;
      border: 3px solid var(--ink);
      background: var(--red);
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.1s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn.secondary {
      background: #FFFFFF;
      color: var(--ink);
      font-size: 1.1rem;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 2.25rem;
      align-items: start;
    }
    @media (max-width: 920px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    /* COMIC TRADING CARD */
    .comic-card {
      background: var(--card-bg);
      border: 5px solid var(--ink);
      box-shadow: 12px 12px 0 var(--ink);
      padding: 1.1rem;
      position: relative;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--ink);
      color: #FFFFFF;
      padding: 0.55rem 0.85rem;
      margin-bottom: 0.75rem;
    }
    .hero-alias {
      font-family: "Bangers", cursive;
      font-size: 1.85rem;
      letter-spacing: 0.05em;
      color: var(--yellow);
      margin: 0;
    }
    .issue-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      background: var(--red);
      color: #FFFFFF;
      padding: 0.2rem 0.5rem;
      border: 2px solid #FFFFFF;
      font-weight: 700;
    }
    .portrait-frame {
      position: relative;
      border: 4px solid var(--ink);
      background: #1B2432;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      margin-bottom: 0.9rem;
    }
    .portrait-frame img.comic-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .original-avatar-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
      overflow: hidden;
      background: #FFFFFF;
    }
    .original-avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .archetype-pill {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: var(--yellow);
      color: var(--ink);
      border: 3px solid var(--ink);
      padding: 0.25rem 0.65rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .speech-bubble {
      background: #FFFDF7;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 0.75rem 1rem;
      font-weight: 700;
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 0.9rem;
      box-shadow: 4px 4px 0 var(--ink);
      position: relative;
    }
    /* ENEMY BANNER ON CARD */
    .nemesis-box {
      border: 3px solid var(--ink);
      background: #18181B;
      color: #FFFFFF;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.9rem;
      box-shadow: 4px 4px 0 var(--red);
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 0.75rem;
      align-items: center;
    }
    .nemesis-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nemesis-name {
      font-family: "Bangers", cursive;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: #FF6B6B;
      margin: 0.1rem 0 0.2rem;
    }
    .nemesis-origin {
      font-size: 0.78rem;
      color: #E2E8F0;
      line-height: 1.35;
    }
    .powers-list {
      display: grid;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
    }
    .power-item {
      border: 2.5px solid var(--ink);
      padding: 0.6rem 0.75rem;
      background: var(--paper);
    }
    .power-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 0.2rem;
    }
    .power-score {
      font-family: "JetBrains Mono", monospace;
      background: var(--blue);
      color: #FFFFFF;
      padding: 0.1rem 0.45rem;
      font-size: 0.75rem;
      border: 1.5px solid var(--ink);
    }
    .power-desc {
      font-size: 0.82rem;
      color: #333B48;
    }
    .card-footer {
      border-top: 3px solid var(--ink);
      padding-top: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      font-weight: 700;
    }
    /* RIGHT PANEL: DETAILS, ENEMY ARENA & GALLERY */
    .panel-box {
      background: #FFFFFF;
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      padding: 1.4rem;
      margin-bottom: 1.65rem;
    }
    .panel-heading {
      font-family: "Bangers", cursive;
      font-size: 1.85rem;
      letter-spacing: 0.04em;
      margin: 0 0 0.9rem 0;
      border-bottom: 3px solid var(--ink);
      padding-bottom: 0.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* ENEMY GRAPHICAL ARENA */
    .enemy-arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      align-items: center;
      background: #18181B;
      color: #FFFFFF;
      border: 3px solid var(--ink);
      padding: 1rem;
      margin-bottom: 0.85rem;
    }
    @media (max-width: 640px) {
      .enemy-arena { grid-template-columns: 1fr; text-align: center; }
    }
    .fighter-card {
      background: #27272A;
      border: 2.5px solid #FFFFFF;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .fighter-card.enemy-side {
      border-color: var(--red);
      background: #2A1215;
    }
    .fighter-thumb {
      width: 66px;
      height: 84px;
      object-fit: cover;
      border: 2px solid var(--yellow);
      flex-shrink: 0;
      background: #0E1117;
    }
    .vs-badge {
      font-family: "Bangers", cursive;
      font-size: 2.2rem;
      background: var(--yellow);
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--red);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .battle-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .battle-select {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      border: 2.5px solid var(--ink);
      background: var(--paper);
    }
    .battle-result {
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      background: #FFF8D6;
      border: 2.5px solid var(--ink);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      display: none;
    }
    .battle-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin-top: 0.65rem;
    }
    .battle-metric-box {
      background: #FFFFFF;
      border: 2px solid var(--ink);
      padding: 0.45rem 0.6rem;
      text-align: center;
    }
    .battle-metric-title {
      font-size: 0.68rem;
      color: #525866;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }
    .battle-metric-values {
      font-size: 0.82rem;
      font-weight: 700;
    }
    .battle-metric-winner {
      display: inline-block;
      margin-top: 0.2rem;
      padding: 0.1rem 0.35rem;
      font-size: 0.68rem;
      background: var(--yellow);
      border: 1.5px solid var(--ink);
    }
    .mini-battle-btn {
      margin-top: 0.4rem;
      width: 100%;
      font-family: "Bangers", cursive;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      padding: 0.25rem 0.4rem;
      border: 2px solid var(--ink);
      background: var(--red);
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .mini-battle-btn:hover {
      background: var(--ink);
      color: var(--yellow);
    }
    .repos-grid {
      display: grid;
      gap: 0.75rem;
    }
    .repo-row {
      border: 2.5px solid var(--ink);
      padding: 0.75rem 1rem;
      background: var(--paper);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .repo-name { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 0.95rem; }
    .repo-desc { font-size: 0.84rem; color: #404854; margin-top: 0.2rem; }
    .repo-meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      background: var(--yellow);
      border: 2px solid var(--ink);
      padding: 0.25rem 0.55rem;
      white-space: nowrap;
      font-weight: 700;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }
    .mini-card {
      border: 3px solid var(--ink);
      background: var(--paper);
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.1s ease;
      position: relative;
    }
    .mini-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .mini-card.active-mini {
      border-color: var(--blue);
      box-shadow: 5px 5px 0 var(--blue);
    }
    .mini-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-bottom: 3px solid var(--ink);
      display: block;
    }
    .mini-card-meta {
      padding: 0.5rem 0.65rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .status-toast {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.75rem 1rem;
      border: 3px solid var(--ink);
      background: var(--yellow);
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="masthead">
      <div>
        <h1 class="masthead-title">GITHUB COMIC HEROES</h1>
        <div class="masthead-sub">Google Antigravity 2.0 • Gemini Nano Banana 2.1 • Cloud Run</div>
      </div>
      <div class="search-bar">
        <input id="usernameInput" type="text" value="ykro" placeholder="GitHub username (e.g. ykro)" />
        <button id="generateBtn" class="btn" onclick="generateCard()">CREAR CARTA</button>
        <a href="/codelab" class="btn secondary">ABRIR CODELAB</a>
      </div>
    </header>

    <div id="statusToast" class="status-toast"></div>

    <div class="main-grid">
      <div id="activeCardContainer"></div>

      <div>
        <section class="panel-box">
          <h2 class="panel-heading">
            <span>ARENA VS ENEMIGO</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;background:var(--red);color:#FFF;padding:0.2rem 0.55rem;border:2px solid var(--ink);">THREAT RADAR</span>
          </h2>
          <div id="enemyArenaContainer"></div>
          <div class="battle-controls">
            <div>
              <label for="enemySelect" style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:700;">ENFRENTAR CONTRA: </label>
              <select id="enemySelect" class="battle-select" onchange="updateEnemyArena()"></select>
            </div>
            <button class="btn" style="font-size:1.1rem;padding:0.4rem 1rem;" onclick="runBattle()">SIMULAR DUELO VS ENEMIGO</button>
          </div>
          <div id="battleResultBox" class="battle-result"></div>
        </section>

        <section class="panel-box">
          <h2 class="panel-heading">HALL OF HEROES &amp; RIVALES (GALERÍA)</h2>
          <div id="galleryContainer" class="gallery-grid"></div>
        </section>

        <section class="panel-box">
          <h2 class="panel-heading">REPOSITORIOS DE ORIGEN</h2>
          <div id="reposContainer" class="repos-grid"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    let allCards = [];
    let activeCard = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeImageUrl(url) {
      const s = String(url || '');
      if (s.startsWith('/generated/') || s.startsWith('https://') || s.startsWith('http://') || s.startsWith('data:image/')) {
        return escapeHtml(s);
      }
      return '';
    }

    function buildVillainSvgDataUrl(nemesisName) {
      const label = String(nemesisName || 'DOCTOR BUG').replace(/[<>&"']/g, '').slice(0, 18);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220">
        <rect width="180" height="220" fill="#18181B"/>
        <circle cx="90" cy="92" r="64" fill="#FF3B30" stroke="#FFD60A" stroke-width="5"/>
        <polygon points="52,42 78,68 45,74" fill="#FFD60A"/>
        <polygon points="128,42 102,68 135,74" fill="#FFD60A"/>
        <rect x="56" y="76" width="24" height="14" rx="3" fill="#0E1117"/>
        <rect x="100" y="76" width="24" height="14" rx="3" fill="#0E1117"/>
        <circle cx="68" cy="83" r="4" fill="#FFD60A"/>
        <circle cx="112" cy="83" r="4" fill="#FFD60A"/>
        <path d="M 60 120 L 75 110 L 90 122 L 105 110 L 120 120" stroke="#0E1117" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="10" y="172" width="160" height="34" fill="#FFD60A" stroke="#0E1117" stroke-width="3"/>
        <text x="90" y="194" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" fill="#0E1117">${label}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function renderActiveCard(card) {
      if (!card) return;
      activeCard = card;
      const container = document.getElementById('activeCardContainer');
      const safeUser = escapeHtml(card.username);
      const safeBadgeSlug = String(card.username || 'ykro').toLowerCase().replace(/[^a-z0-9-_]/g, '');

      const powersHtml = (card.superpowers || []).map(p => `
        <div class="power-item">
          <div class="power-header">
            <span>${escapeHtml(p.name)}</span>
            <span class="power-score">${escapeHtml(p.power)} PWR</span>
          </div>
          <div class="power-desc">${escapeHtml(p.description)}</div>
        </div>
      `).join('');

      const nemesisName = card.archNemesis || 'DOCTOR RACE-CONDITION & THE ANY-TYPE SWARM';
      const originText = card.originStory || `Defends @${card.username}'s repositories from ${nemesisName}.`;
      const villainThumb = buildVillainSvgDataUrl(nemesisName);

      container.innerHTML = `
        <article class="comic-card" id="comicCard">
          <div class="card-top">
            <h2 class="hero-alias">${escapeHtml(card.heroAlias)}</h2>
            <span class="issue-tag">${escapeHtml(card.powerTier || card.issueNumber || '#1')}</span>
          </div>
          <div class="portrait-frame">
            <img class="comic-art" src="${safeImageUrl(card.comicImageUrl)}" alt="${escapeHtml(card.heroAlias)}" />
            <div class="original-avatar-badge" title="Foto original de GitHub (@${safeUser})">
              <img src="${safeImageUrl(card.avatarUrl)}" alt="@${safeUser}" />
            </div>
            <div class="archetype-pill">${escapeHtml(card.archetype)}</div>
          </div>
          <div class="speech-bubble">${escapeHtml(card.battleCry)}</div>

          <div class="nemesis-box">
            <img src="${villainThumb}" alt="Enemigo" style="width:52px;height:64px;border:2px solid var(--yellow);display:block;" />
            <div>
              <div class="nemesis-label">
                <span>ENEMIGO PRINCIPAL</span>
                <a href="/badges/${safeBadgeSlug}.svg" target="_blank" rel="noopener" style="color:#FFD60A;text-decoration:none;font-weight:700;">INSIGNIA SVG ↗</a>
              </div>
              <div class="nemesis-name">${escapeHtml(nemesisName)}</div>
              <div class="nemesis-origin">${escapeHtml(originText)}</div>
            </div>
          </div>

          <div class="powers-list">${powersHtml}</div>
          <div class="card-footer">
            <span>@${safeUser} • ${escapeHtml((card.topLanguages || []).join(' / '))}</span>
            <span>${escapeHtml(card.publicRepos)} REPOS • ${escapeHtml(card.totalStars)} ★</span>
          </div>
        </article>
      `;

      const reposContainer = document.getElementById('reposContainer');
      reposContainer.innerHTML = (card.topRepos || []).map(r => `
        <div class="repo-row">
          <div>
            <div class="repo-name">${escapeHtml(r.name)}</div>
            <div class="repo-desc">${escapeHtml(r.description)}</div>
          </div>
          <span class="repo-meta">${escapeHtml(r.language)} • ★ ${escapeHtml(r.stars)}</span>
        </div>
      `).join('');

      populateEnemySelector();
      updateEnemyArena();
      renderGallery();
    }

    function populateEnemySelector() {
      const sel = document.getElementById('enemySelect');
      if (!activeCard) return;
      const options = [];
      let preferredRival = '';
      for (const c of allCards) {
        if (c.username.toLowerCase() !== activeCard.username.toLowerCase()) {
          if (!preferredRival || c.username.toLowerCase() === 'torvalds') {
            preferredRival = c.username;
          }
          options.push(`<option value="${escapeHtml(c.username)}">Rival: ${escapeHtml(c.heroAlias)} (@${escapeHtml(c.username)})</option>`);
        }
      }
      options.push(`<option value="__nemesis__">Enemigo: ${escapeHtml(activeCard.archNemesis || 'DOCTOR BUG')}</option>`);
      sel.innerHTML = options.join('');
      if (preferredRival) {
        sel.value = preferredRival;
      }
      document.getElementById('battleResultBox').style.display = 'none';
    }

    function updateEnemyArena() {
      if (!activeCard) return;
      const sel = document.getElementById('enemySelect').value;
      const arena = document.getElementById('enemyArenaContainer');
      const heroRating = activeCard.overallRating || 95;
      const heroRepos = activeCard.publicRepos || 0;
      const heroStars = activeCard.totalStars || 0;

      let enemyTitle = activeCard.archNemesis || 'DOCTOR RACE-CONDITION';
      let enemySub = 'Villano de Producción • Threat Lvl 92';
      let enemyStats = '';
      let enemyImg = buildVillainSvgDataUrl(enemyTitle);

      if (sel && sel !== '__nemesis__') {
        const rival = allCards.find(c => c.username.toLowerCase() === sel.toLowerCase());
        if (rival) {
          enemyTitle = rival.heroAlias;
          enemySub = `@${rival.username} • ${rival.overallRating || 90} PWR`;
          enemyStats = `${rival.publicRepos || 0} REPOS • ${rival.totalStars || 0} ★`;
          enemyImg = safeImageUrl(rival.comicImageUrl);
        }
      }

      arena.innerHTML = `
        <div class="enemy-arena">
          <div class="fighter-card">
            <img class="fighter-thumb" src="${safeImageUrl(activeCard.comicImageUrl)}" alt="${escapeHtml(activeCard.heroAlias)}" />
            <div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--yellow);">HÉROE ACTIVO</div>
              <div style="font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:0.04em;">${escapeHtml(activeCard.heroAlias)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:#CBD5E1;">@${escapeHtml(activeCard.username)} • ${escapeHtml(heroRating)} PWR</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:#94A3B8;margin-top:0.15rem;">${escapeHtml(heroRepos)} REPOS • ${escapeHtml(heroStars)} ★</div>
            </div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="fighter-card enemy-side">
            <img class="fighter-thumb" src="${enemyImg}" alt="${escapeHtml(enemyTitle)}" />
            <div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#FF6B6B;">ENEMIGO / RIVAL</div>
              <div style="font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:0.04em;color:#FFD60A;">${escapeHtml(enemyTitle)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:#FECACA;">${escapeHtml(enemySub)}</div>
              ${enemyStats ? `<div style="font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:#FCA5A5;margin-top:0.15rem;">${escapeHtml(enemyStats)}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    async function runBattle() {
      if (!activeCard) return;
      const sel = document.getElementById('enemySelect').value;
      const box = document.getElementById('battleResultBox');
      box.style.display = 'block';

      if (!sel || sel === '__nemesis__') {
        const topPower = (activeCard.superpowers && activeCard.superpowers[0]?.name) || 'Agentic Overdrive';
        box.textContent = `VICTORIA: ${activeCard.heroAlias} (@${activeCard.username}) activa "${topPower}" y derrota a su enemigo ${activeCard.archNemesis || 'DOCTOR BUG'} en producción.`;
        return;
      }

      try {
        const res = await fetch(`/api/battle?hero=${encodeURIComponent(activeCard.username)}&enemy=${encodeURIComponent(sel)}`);
        const data = await res.json();
        const cmp = data.comparison || {};
        const pwr = cmp.pwr || { hero: data.hero?.score, enemy: data.enemy?.score, winner: data.winner };
        const repos = cmp.repos || { hero: data.hero?.publicRepos ?? 0, enemy: data.enemy?.publicRepos ?? 0, winner: data.winner };
        const stars = cmp.stars || { hero: data.hero?.totalStars ?? 0, enemy: data.enemy?.totalStars ?? 0, winner: data.winner };

        box.innerHTML = `
          <div>${escapeHtml(data.narrative || `Ganador del duelo: @${data.winner}`)}</div>
          <div class="battle-metrics-grid">
            <div class="battle-metric-box">
              <div class="battle-metric-title">Puntos PWR</div>
              <div class="battle-metric-values">${escapeHtml(pwr.hero)} vs ${escapeHtml(pwr.enemy)}</div>
              <span class="battle-metric-winner">★ @${escapeHtml(pwr.winner)}</span>
            </div>
            <div class="battle-metric-box">
              <div class="battle-metric-title">Repositorios</div>
              <div class="battle-metric-values">${escapeHtml(repos.hero)} vs ${escapeHtml(repos.enemy)}</div>
              <span class="battle-metric-winner">★ @${escapeHtml(repos.winner)}</span>
            </div>
            <div class="battle-metric-box">
              <div class="battle-metric-title">Estrellas ★</div>
              <div class="battle-metric-values">${escapeHtml(Number(stars.hero || 0).toLocaleString('en-US'))} vs ${escapeHtml(Number(stars.enemy || 0).toLocaleString('en-US'))}</div>
              <span class="battle-metric-winner">★ @${escapeHtml(stars.winner)}</span>
            </div>
          </div>
        `;
      } catch (err) {
        box.textContent = `Error al simular duelo: ${err.message}`;
      }
    }

    function challengeFromGallery(event, rivalUsername) {
      if (event) event.stopPropagation();
      const sel = document.getElementById('enemySelect');
      if (!sel) return;
      sel.value = rivalUsername;
      updateEnemyArena();
      runBattle();
    }

    function renderGallery() {
      const gallery = document.getElementById('galleryContainer');
      gallery.innerHTML = allCards.map((c, idx) => {
        const isCurrent = activeCard && c.username.toLowerCase() === activeCard.username.toLowerCase();
        return `
          <div class="mini-card ${isCurrent ? 'active-mini' : ''}" onclick="selectCard(${idx})">
            <img src="${safeImageUrl(c.comicImageUrl)}" alt="${escapeHtml(c.heroAlias)}" />
            <div class="mini-card-meta">
              <div>${escapeHtml(c.heroAlias)}</div>
              <div style="color:#525866">@${escapeHtml(c.username)} • ${escapeHtml(c.overallRating || 90)} PWR</div>
              <div style="color:#525866;font-size:0.68rem;margin-top:0.1rem;">${escapeHtml(c.publicRepos || 0)} REPOS • ${escapeHtml(c.totalStars || 0)} ★</div>
              ${!isCurrent ? `<button type="button" class="mini-battle-btn" onclick="challengeFromGallery(event, '${escapeHtml(c.username)}')">⚔️ ENFRENTAR</button>` : `<div style="color:var(--blue);font-size:0.68rem;margin-top:0.35rem;">★ HÉROE ACTIVO</div>`}
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCard(idx) {
      if (allCards[idx]) {
        document.getElementById('usernameInput').value = allCards[idx].username;
        renderActiveCard(allCards[idx]);
      }
    }

    async function loadExistingCards() {
      const res = await fetch('/api/cards');
      allCards = await res.json();
      if (allCards.length > 0) {
        const currentInput = (document.getElementById('usernameInput').value || 'ykro').trim().toLowerCase();
        const chosen = allCards.find(c => c.username.toLowerCase() === currentInput) || allCards[0];
        document.getElementById('usernameInput').value = chosen.username;
        renderActiveCard(chosen);
      }
    }

    async function generateCard() {
      const input = document.getElementById('usernameInput');
      const btn = document.getElementById('generateBtn');
      const toast = document.getElementById('statusToast');
      const username = input.value.trim() || 'ykro';

      btn.disabled = true;
      toast.style.display = 'block';
      toast.textContent = `Consultando repositorios de @${username} e ilustrando retrato con Nano Banana 2.1...`;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo generar la carta');
        toast.textContent = `Carta generada para @${data.username} (${data.heroAlias}) usando ${data.imageModelUsed}.`;
        await loadExistingCards();
      } catch (err) {
        toast.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    loadExistingCards();
  </script>
</body>
</html>
