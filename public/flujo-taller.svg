<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8F7F4; }
      .card { fill: #FFFFFF; stroke: #DFDDD4; stroke-width: 2; }
      .bar-1 { fill: #18181B; }
      .bar-2 { fill: #0F766E; }
      .bar-3 { fill: #D97706; }
      .bar-4 { fill: #6D28D9; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 800; fill: #18181B; }
      .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill: #52525B; }
      .arrow { stroke: #18181B; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" class="bg"/>

  <!-- Flechas horizontales -->
  <line x1="275" y1="140" x2="323" y2="140" class="arrow" marker-end="url(#arrow)"/>
  <line x1="565" y1="140" x2="613" y2="140" class="arrow" marker-end="url(#arrow)"/>
  <line x1="855" y1="140" x2="903" y2="140" class="arrow" marker-end="url(#arrow)"/>

  <!-- Bloque 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="60" width="235" height="160" rx="20" class="card"/>
    <path d="M 40 78 Q 40 60 58 60 H 257 Q 275 60 275 78 V 82 H 40 Z" class="bar-1"/>
    <text x="157" y="132" text-anchor="middle" class="title">1. Diseñar</text>
    <text x="157" y="165" text-anchor="middle" class="desc">Proyectos, /plan e IDE</text>
  </g>

  <!-- Bloque 2 -->
  <g filter="url(#shadow)">
    <rect x="330" y="60" width="235" height="160" rx="20" class="card"/>
    <path d="M 330 78 Q 330 60 348 60 H 547 Q 565 60 565 78 V 82 H 330 Z" class="bar-2"/>
    <text x="447" y="132" text-anchor="middle" class="title">2. Probar</text>
    <text x="447" y="165" text-anchor="middle" class="desc">/browser en Chrome</text>
  </g>

  <!-- Bloque 3 -->
  <g filter="url(#shadow)">
    <rect x="620" y="60" width="235" height="160" rx="20" class="card"/>
    <path d="M 620 78 Q 620 60 638 60 H 837 Q 855 60 855 78 V 82 H 620 Z" class="bar-3"/>
    <text x="737" y="132" text-anchor="middle" class="title">3. Automatizar</text>
    <text x="737" y="165" text-anchor="middle" class="desc">/schedule y SKILL.md</text>
  </g>

  <!-- Bloque 4 -->
  <g filter="url(#shadow)">
    <rect x="910" y="60" width="250" height="160" rx="20" class="card"/>
    <path d="M 910 78 Q 910 60 928 60 H 1142 Q 1160 60 1160 78 V 82 H 910 Z" class="bar-4"/>
    <text x="1035" y="132" text-anchor="middle" class="title">4. Publicar</text>
    <text x="1035" y="165" text-anchor="middle" class="desc">MCP en Cloud Run</text>
  </g>
</svg>
